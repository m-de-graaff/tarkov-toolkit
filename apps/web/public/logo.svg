<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Tarkov Toolkit mark: a planned raid route from spawn (green) to the
       extract pin, in the app's gold on its near-black surface. -->
  <defs>
    <clipPath id="rr"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>
  <g clip-path="url(#rr)">
    <rect width="512" height="512" fill="#111110"/>
    <!-- faint map contours -->
    <g fill="none" stroke="#262624" stroke-width="10">
      <path d="M-20 128 C 90 100, 170 168, 280 140 S 460 76, 540 112"/>
      <path d="M-20 396 C 110 362, 210 440, 340 404 S 480 340, 540 380"/>
    </g>
    <!-- the route: evenly dotted curve -->
    <path d="M120 396 C 196 366, 148 268, 232 226 S 330 202, 346 190"
          fill="none" stroke="#d4bb70" stroke-width="23"
          stroke-linecap="round" stroke-dasharray="0.1 46"/>
    <!-- spawn -->
    <circle cx="118" cy="398" r="36" fill="#4a7a52"/>
    <circle cx="118" cy="398" r="36" fill="none" stroke="#111110" stroke-width="9"/>
    <!-- extract pin -->
    <path d="M356 92 c -50 0 -90 40 -90 90 c 0 68 90 152 90 152 s 90 -84 90 -152 c 0 -50 -40 -90 -90 -90 z"
          fill="#d4bb70" stroke="#111110" stroke-width="10"/>
    <circle cx="356" cy="180" r="35" fill="#111110"/>
  </g>
</svg>
